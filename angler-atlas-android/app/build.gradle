plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rivertrace.angleratlas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rivertrace.angleratlas'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.4.0-beta.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../angler-atlas-demo']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

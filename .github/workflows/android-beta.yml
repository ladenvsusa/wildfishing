name: Build Android Beta APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['beta-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build installable beta APK
        run: gradle -p angler-atlas-android :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp angler-atlas-android/app/build/outputs/apk/debug/app-debug.apk dist/angler-atlas-0.4.0-beta.1.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: angler-atlas-android-beta
          path: dist/angler-atlas-0.4.0-beta.1.apk
          if-no-files-found: error

      - name: Publish prerelease for beta tag
        if: startsWith(github.ref, 'refs/tags/beta-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/angler-atlas-0.4.0-beta.1.apk
          --title "野水簿 0.4.0 Beta 1"
          --prerelease
          --generate-notes
